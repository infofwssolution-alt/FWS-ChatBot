services:
  - type: web
    name: ai-chatbot-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_PER_IP_HOUR
        value: "60"
      - key: DAILY_CAP_PER_CLIENT
        value: "500"
      - key: ADMIN_TOKEN
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
